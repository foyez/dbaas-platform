apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: dbaas-api
  namespace: dbaas-api

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dbaas-deploy

  minReplicas: 2
  maxReplicas: 10

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70