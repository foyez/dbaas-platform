apiVersion: apps/v1
kind: Deployment
metadata:
  name: dbaas-deploy
  namespace: dbaas-api
spec:
  replicas: 2
  
  selector:
    matchLabels:
      app: dbaas

  template:
    metadata:
      labels:
        app: dbaas

    spec:
      serviceAccountName: dbaas-api

      imagePullSecrets:
        - name: stackit-registry-secret

      containers:
        - name: dbaas-api
          image: registry.onstackit.cloud/dbaas-platform/dbaas-platform-api:latest

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          envFrom:
            - configMapRef:
                name: dbaas-api-config

          # env:
          #   - name: ZITADEL_DOMAIN
          #     value: "dbaas-jhuvx5.eu1.zitadel.cloud"

          #   - name: ZITADEL_KEY_PATH
          #     value: "/var/run/secrets/zitadel/zitadel-key.json"

          volumeMounts:
            - name: zitadel-key
              mountPath: /var/run/secrets/zitadel
              readOnly: true

          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

      volumes:
        - name: zitadel-key
          secret:
            secretName: dbaas-zitadel-key
            defaultMode: 0444

---
apiVersion: v1
kind: Service

metadata:
  name: dbaas-svc
  namespace: dbaas-api

  labels:
    app.kubernetes.io/name: dbaas-api
    
spec:
  type: ClusterIP

  selector:
    app: dbaas

  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP