apiVersion: v1
kind: ConfigMap
metadata:
  name: dbaas-api-config
  namespace: dbaas-api
data:
  APP_ENV: "production"
  APP_LOG_LEVEL: "info"
  SERVER_ADDRESS: ":8080"
  SERVER_ALLOW_ORIGINS: "https://app.foyez.runs.onstackit.cloud"
  ZITADEL_DOMAIN: "dbass-k4ho6i.eu1.zitadel.cloud"
  ZITADEL_KEY_PATH: "/var/run/secrets/zitadel/zitadel-key.json"
  # A record pointing at the ingress-nginx LoadBalancer's external IP -
  # same IP as app.foyez.runs.onstackit.cloud, different DNS name since
  # this is reached by raw TCP:<allocated-port>, not HTTP/SNI routing.
  PUBLIC_DB_HOST: "db.foyez.runs.onstackit.cloud"
  # Traces go over OTLP to Alloy, which forwards them to Tempo.
  OTEL_SERVICE_NAME: "dbaas-api"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://dbaas-alloy.observability.svc.cluster.local:4317"
