apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Local kind cluster (make dev). Built and loaded by hack/dev/up.sh:
#   docker build -f platform/Containerfile --target prod -t dbaas-platform-api:dev ./platform
resources:
  - ../../base

images:
  - name: registry.onstackit.cloud/dbaas-platform/dbaas-platform-api
    newName: dbaas-platform-api
    newTag: dev

patches:
  # Plain HTTP on http://api.dbaas.localhost - no TLS or cert-manager locally.
  - target:
      kind: Ingress
      name: dbaas-api
    patch: |-
      - op: remove
        path: /spec/tls
      - op: replace
        path: /spec/rules/0/host
        value: api.dbaas.localhost

  - patch: |-
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: dbaas-api-tls
        namespace: dbaas-api
      $patch: delete

  # One replica is enough on a laptop.
  - patch: |-
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: dbaas-api
        namespace: dbaas-api
      $patch: delete

  # Image is loaded into kind, never pulled from the private registry.
  - target:
      kind: Deployment
      name: dbaas-deploy
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: remove
        path: /spec/template/spec/imagePullSecrets
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent

  # Local ZITADEL over plain HTTP (see hack/dev/zitadel-values.yaml). No
  # public DB host: the TCP passthrough isn't wired up locally.
  - target:
      kind: ConfigMap
      name: dbaas-api-config
    patch: |-
      - op: replace
        path: /data/APP_ENV
        value: development
      - op: replace
        path: /data/SERVER_ALLOW_ORIGINS
        value: http://app.dbaas.localhost
      - op: replace
        path: /data/ZITADEL_DOMAIN
        value: auth.dbaas.localhost
      - op: add
        path: /data/ZITADEL_INSECURE_PORT
        value: "80"
      - op: replace
        path: /data/PUBLIC_DB_HOST
        value: ""
