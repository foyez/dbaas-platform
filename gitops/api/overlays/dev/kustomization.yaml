apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Build locally with: docker build -t dbaas-platform-api:dev ./platform
# OrbStack's Kubernetes shares Docker's image store, so no push/registry needed.
images:
  - name: registry.onstackit.cloud/dbaas-platform/dbaas-platform-api
    newName: dbaas-platform-api
    newTag: dev

patches:
  # No Ingress/TLS locally - reach the API via `kubectl port-forward` instead
  - patch: |-
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: dbaas-api
        namespace: dbaas-api
      $patch: delete

  - patch: |-
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: dbaas-api-tls
        namespace: dbaas-api
      $patch: delete

  # Drop the private-registry pull secret and force IfNotPresent so the
  # kubelet never tries to actually pull ":dev" from a registry.
  - target:
      kind: Deployment
      name: dbaas-deploy
    patch: |-
      - op: remove
        path: /spec/template/spec/imagePullSecrets
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent

  - target:
      kind: ConfigMap
      name: dbaas-api-config
    patch: |-
      - op: replace
        path: /data/APP_ENV
        value: development
      - op: replace
        path: /data/SERVER_ALLOW_ORIGINS
        value: http://localhost:5173

