apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dbaas-frontend
  namespace: dbaas-frontend
spec:
  ingressClassName: nginx
  rules:
    - host: app.foyez.runs.onstackit.cloud
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dbaas-frontend-svc
                port:
                  number: 3000