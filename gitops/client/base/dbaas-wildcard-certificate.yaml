apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dbaas-wildcard
  namespace: dbaas-frontend

spec:
  secretName: dbaas-wildcard-tls

  issuerRef:
    name: letsencrypt-prod
    kind: Issuer

  commonName: "*.foyez.runs.onstackit.cloud"
  duration: 8760h0m0s

  dnsNames:
    - "foyez.runs.onstackit.cloud"
    - "*.foyez.runs.onstackit.cloud"