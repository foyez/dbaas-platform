apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Local kind cluster (make dev). Built and loaded by hack/dev/up.sh, with the
# VITE_* build args pointing at the local ZITADEL and API.
resources:
  - ../../base

images:
  - name: registry.onstackit.cloud/dbaas-platform/dbaas-frontend
    newName: dbaas-frontend
    newTag: dev

patches:
  # Plain HTTP on http://app.dbaas.localhost - no TLS or cert-manager locally.
  - target:
      kind: Ingress
      name: dbaas-frontend
    patch: |-
      - op: remove
        path: /spec/tls
      - op: replace
        path: /spec/rules/0/host
        value: app.dbaas.localhost

  - patch: |-
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: dbaas-wildcard
        namespace: dbaas-frontend
      $patch: delete

  - target:
      kind: Deployment
      name: dbaas-frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: remove
        path: /spec/template/spec/imagePullSecrets
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
