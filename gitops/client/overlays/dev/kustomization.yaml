apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Build locally with: docker build -t dbaas-frontend:dev ./client
images:
  - name: registry.onstackit.cloud/dbaas-platform/dbaas-frontend
    newName: dbaas-frontend
    newTag: dev

patches:
  # No Ingress/TLS locally - reach the UI via `kubectl port-forward` instead
  - patch: |-
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: dbaas-frontend
        namespace: dbaas-frontend
      $patch: delete
 
  - patch: |-
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: dbaas-wildcard
        namespace: dbaas-frontend
      $patch: delete

  - target:
      kind: Deployment
      name: dbaas-frontend
    patch: |-
      - op: remove
        path: /spec/template/spec/imagePullSecrets
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
