apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: postgres-platform-operator
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://level3.git.onstackit.cloud/LEVEL3/foyez-inra.git
    targetRevision: main
    path: gitops/operator/overlays/prod

  destination:
    server: https://kubernetes.default.svc
    namespace: dbaas-operator

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      # Needed because CRDs are installed
      - CreateNamespace=true
      - ServerSideApply=true