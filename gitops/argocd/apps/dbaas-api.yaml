apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: dbaas-api
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://level3.git.onstackit.cloud/LEVEL3/foyez-inra.git
    targetRevision: main
    path: gitops/api/overlays/prod

  destination:
    server: https://kubernetes.default.svc
    namespace: dbaas-api

  syncPolicy:
    # automated:
    #   prune: true
    #   selfHeal: true

    syncOptions:
      - CreateNamespace=true