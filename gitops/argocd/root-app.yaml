apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: dbaas-platform
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://level3.git.onstackit.cloud/LEVEL3/foyez-inra.git
    targetRevision: main
    path: gitops/argocd

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true