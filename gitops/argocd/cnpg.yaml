apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: cnpg
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://your-forgejo.example.com/your-org/platform.git
    targetRevision: main
    path: gitops/cnpg/overlays/prod

  destination:
    server: https://kubernetes.default.svc

  syncPolicy:
    automated:
      prune: true
      selfHeal: true