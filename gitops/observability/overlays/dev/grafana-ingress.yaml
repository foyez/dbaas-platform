apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dbaas-grafana
  namespace: observability
spec:
  ingressClassName: nginx
  rules:
    - host: grafana.dbaas.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dbaas-grafana
                port:
                  number: 80
