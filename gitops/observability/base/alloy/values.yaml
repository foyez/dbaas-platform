alloy:
  # Under `alloy:`: a top-level `resources` key isn't read by the chart.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi
  extraPorts:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
  configMap:
    content: |
      logging {
        level = "info"
      }

      // Discover all pods on this node
      discovery.kubernetes "pods" {
        role = "pod"
      }

      // Find the actual log file path on disk for each container
      // Attach k8s + ownership metadata as Loki labels
      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_label_cnpg_io_cluster"]
          target_label = "instance_id"
        }

        // Ownership label (app.example.com/user-id), propagated via
        // the operator's InheritedMetadata
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_example_com_user_id"]
          target_label = "owner_id"
        }
      }

      loki.source.kubernetes "pod_logs" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://dbaas-loki:3100/loki/api/v1/push"
          // url = "http://dbaas-loki-gateway.observability.svc.cluster.local/loki/api/v1/push"
        }
      }

      // Traces: the API sends OTLP here (OTEL_EXPORTER_OTLP_ENDPOINT);
      // Alloy batches them and forwards to Tempo.
      otelcol.receiver.otlp "default" {
        grpc {
          endpoint = "0.0.0.0:4317"
        }
        http {
          endpoint = "0.0.0.0:4318"
        }
        output {
          traces = [otelcol.processor.batch.default.input]
        }
      }

      otelcol.processor.batch "default" {
        output {
          traces = [otelcol.exporter.otlp.tempo.input]
        }
      }

      otelcol.exporter.otlp "tempo" {
        client {
          endpoint = "dbaas-tempo:4317"
          tls {
            insecure = true
          }
        }
      }

controller:
  type: daemonset   # one Alloy pod per node - required to read local log files
