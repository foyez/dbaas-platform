deploymentMode: Monolithic

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  schemaConfig:
    configs:
      - from: "2026-01-01"
        store: tsdb
        object_store: filesystem # s3
        schema: v13
        index:
          prefix: dbaas_loki_index_
          period: 24h

  storage:
    type: filesystem
    filesystem:
      chunks_directory: /var/loki/chunks
      rules_directory: /var/loki/rules

  #   type: s3

  #   bucketNames:
  #     chunks: <LOKI_CHUNKS_BUCKET>
  #     ruler: <LOKI_RULER_BUCKET>

  #   s3:
  #     endpoint: <S3_ENDPOINT>
  #     region: <S3_REGION>
  #     accessKeyId: <DO_NOT_PUT_SECRET_HERE>
  #     secretAccessKey: <DO_NOT_PUT_SECRET_HERE>

  limits_config:
    retention_period: 720h
    allow_structured_metadata: true
    volume_enabled: true

minio:
  enabled: false

# Disable external Memcached caches for this small/local deployment.
# This avoids additional pods requesting significant CPU/memory.
resultsCache:
  enabled: false

chunksCache:
  enabled: false

# Single Loki process.
singleBinary:
  replicas: 1
  # persistence:
  #   enabled: true
  #   size: 10Gi

gateway:
  enabled: true

# Not used in Monolithic mode.
read:
  replicas: 0

write:
  replicas: 0

backend:
  replicas: 0
