deploymentMode: Monolithic

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  storage:
    type: filesystem
    # filesystem:
    #   chunks_directory: /var/loki/chunks
    #   rules_directory: /var/loki/rules

  #   type: s3

  #   bucketNames:
  #     chunks: <LOKI_CHUNKS_BUCKET>
  #     ruler: <LOKI_RULER_BUCKET>

  #   s3:
  #     endpoint: <S3_ENDPOINT>
  #     region: <S3_REGION>
  #     accessKeyId: <DO_NOT_PUT_SECRET_HERE>
  #     secretAccessKey: <DO_NOT_PUT_SECRET_HERE>

  schemaConfig:
    configs:
      - from: "2026-01-01"
        store: tsdb
        object_store: filesystem # s3
        schema: v13
        index:
          prefix: dbaas_loki_index_
          period: 24h

  limits_config:
    retention_period: 168h # 7 days
    # allow_structured_metadata: true
    # volume_enabled: true

singleBinary:
  replicas: 1
  # resources:
  #   requests:
  #     cpu: 200m
  #     memory: 256Mi
  #   limits:
  #     memory: 512Mi
  # persistence:
  #   enabled: true
  #   size: 10Gi

minio:
  enabled: false

# Disable external Memcached caches for this small/local deployment.
# This avoids additional pods requesting significant CPU/memory.
resultsCache:
  enabled: false

chunksCache:
  enabled: false

gateway:
  enabled: false # not needed for internal-only cluster access

# not needed in single-binary mode
read:
  replicas: 0

write:
  replicas: 0

backend:
  replicas: 0

test:
  enabled: false
