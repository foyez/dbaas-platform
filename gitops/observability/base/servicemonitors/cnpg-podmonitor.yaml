# PostgreSQL metrics from every CloudNativePG instance pod (platform
# databases and ZITADEL's own): connections, transactions, replication,
# database size. CNPG serves them on the "metrics" port (9187).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cnpg-instances
  namespace: observability
spec:
  namespaceSelector:
    any: true
  selector:
    matchLabels:
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
