# controller-runtime metrics from the dbaas operator: reconcile counts,
# errors and durations, work queue depth. The operator serves them over
# HTTPS and checks the caller's token, so Prometheus sends its service
# account token and is granted the operator's metrics-reader role below.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: dbaas-operator
  namespace: observability
spec:
  namespaceSelector:
    matchNames:
      - dbaas-operator
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: postgresql-dbpaas-platform
  endpoints:
    - port: https
      path: /metrics
      scheme: https
      interval: 30s
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      tlsConfig:
        # The operator uses a self-signed serving certificate.
        insecureSkipVerify: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dbaas-prometheus-operator-metrics-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  # operator/config/rbac/metrics_reader_role.yaml after the kustomize namePrefix.
  name: postgresql-dbpaas-platform-metrics-reader
subjects:
  - kind: ServiceAccount
    name: dbaas-prometheus-kube-prom-prometheus
    namespace: observability
