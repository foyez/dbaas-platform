apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: observability

helmCharts:
  - name: kube-prometheus-stack
    repo: https://prometheus-community.github.io/helm-charts
    version: 87.21.0
    releaseName: dbaas-prometheus
    # The Prometheus Operator CRDs (Prometheus, ServiceMonitor, PodMonitor, ...).
    # Large, so apply the rendered output with --server-side.
    includeCRDs: true
    namespace: observability
    valuesFile: values.yaml