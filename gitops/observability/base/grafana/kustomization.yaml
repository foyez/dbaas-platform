apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - dashboard-api-overview.yaml

helmCharts:
  - name: grafana
    repo: https://grafana-community.github.io/helm-charts
    version: 12.10.0
    releaseName: dbaas-grafana
    namespace: observability
    valuesFile: values.yaml