adminUser: admin
adminPassword: admin
# admin:
#   existingSecret: "grafana-admin-credentials"   # wire via external-secrets before real traffic
#   userKey: admin-user
#   passwordKey: admin-password

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      # Fixed UIDs so the datasources can link to each other.
      # `$$` escapes Grafana variables from provisioning's env expansion.
      - name: Prometheus
        uid: prometheus
        type: prometheus
        # points at the Prometheus Service from kube-prometheus-stack release
        url: http://dbaas-prometheus-kube-prom-prometheus:9090
        access: proxy
        isDefault: true

      - name: Loki
        uid: loki
        type: loki
        url: http://dbaas-loki:3100
        access: proxy
        jsonData:
          # A trace_id in a JSON log line becomes a link to the trace.
          derivedFields:
            - name: TraceID
              matcherRegex: '"trace_id":"(\w+)"'
              datasourceUid: tempo
              url: "$${__value.raw}"

      - name: Tempo
        uid: tempo
        type: tempo
        url: http://dbaas-tempo:3200
        access: proxy
        jsonData:
          # From a span, jump to the API's log lines for the same request.
          tracesToLogsV2:
            datasourceUid: loki
            customQuery: true
            query: '{namespace="dbaas-api"} | json | trace_id="$${__trace.traceId}"'
            spanStartTimeShift: "-5m"
            spanEndTimeShift: "5m"

# Sidecar watches for ConfigMaps labeled grafana_dashboard=1
# and loads them automatically - this is how dashboards-as-code works
sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"
    folder: /tmp/dashboards
    provider:
      foldersFromFilesStructure: false
    # dashboards live in the same 'observability' namespace as Grafana,
    # so default namespace-scoped RBAC (a Role, not ClusterRole) is enough -
    # no extra config needed unless you later want dashboards from other namespaces

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi