apiVersion: v1
kind: ConfigMap
metadata:
  name: dbaas-api-overview-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  dbaas-api-overview.json: |
    {
      "title": "DBaaS API Overview",
      "uid": "dbaas-api-overview",
      "tags": ["dbaas"],
      "timezone": "browser",
      "schemaVersion": 39,
      "panels": [
        {
          "id": 1,
          "title": "Request Rate by Route",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "sum(rate(dbaas_http_requests_total[5m])) by (route, status)",
              "legendFormat": "{{route}} - {{status}}"
            }
          ]
        },
        {
          "id": 2,
          "title": "P95 Latency by Route",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(dbaas_http_request_duration_seconds_bucket[5m])) by (le, route))",
              "legendFormat": "{{route}}"
            }
          ]
        },
        {
          "id": 3,
          "title": "Goroutines",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [
            { "expr": "go_goroutines{job=\"dbaas-svc\"}" }
          ]
        },
        {
          "id": 4,
          "title": "Memory (RSS)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [
            { "expr": "process_resident_memory_bytes{job=\"dbaas-svc\"}" }
          ]
        }
      ]
    }