apiVersion: v1
kind: ConfigMap
metadata:
  name: dbaas-api-overview-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  dbaas-api-overview.json: |
    {
      "title": "DBaaS API Overview",
      "uid": "dbaas-api-overview",
      "tags": ["dbaas", "api", "http"],
      "timezone": "browser",
      "schemaVersion": 39,
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "refresh": "30s",
      "editable": true,
      "graphTooltip": 1,
      "liveNow": false,

      "panels": [
        {
          "id": 10,
          "title": "Request Rate",
          "description": "Current HTTP request rate across the DBaaS API.",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(dbaas_http_requests_total{job=\"dbaas-svc\",route=~\"$route\"}[5m]))",
              "legendFormat": "Requests/sec"
            }
          ],
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": ["lastNotNull"]
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "decimals": 2,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            }
          }
        },

        {
          "id": 11,
          "title": "Success Rate",
          "description": "Percentage of requests returning a non-5xx response.",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * (1 - (sum(rate(dbaas_http_requests_total{job=\"dbaas-svc\",route=~\"$route\",status=~\"5..\"}[5m])) / clamp_min(sum(rate(dbaas_http_requests_total{job=\"dbaas-svc\",route=~\"$route\"}[5m])), 0.000001)))",
              "legendFormat": "Success"
            }
          ],
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": ["lastNotNull"]
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 2,
              "min": 0,
              "max": 100,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 99
                  },
                  {
                    "color": "green",
                    "value": 99.9
                  }
                ]
              }
            }
          }
        },

        {
          "id": 12,
          "title": "P95 Latency",
          "description": "95th percentile HTTP request latency.",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum(rate(dbaas_http_request_duration_seconds_bucket{job=\"dbaas-svc\",route=~\"$route\"}[5m])) by (le))",
              "legendFormat": "p95"
            }
          ],
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": ["lastNotNull"]
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 3,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 0.5
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            }
          }
        },

        {
          "id": 13,
          "title": "5xx Error Rate",
          "description": "Percentage of requests returning HTTP 5xx responses.",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * sum(rate(dbaas_http_requests_total{job=\"dbaas-svc\",route=~\"$route\",status=~\"5..\"}[5m])) / clamp_min(sum(rate(dbaas_http_requests_total{job=\"dbaas-svc\",route=~\"$route\"}[5m])), 0.000001)",
              "legendFormat": "5xx"
            }
          ],
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": ["lastNotNull"]
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "justifyMode": "center"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 2,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 5
                  }
                ]
              }
            }
          }
        },

        {
          "id": 1,
          "title": "Request Rate by Route",
          "description": "HTTP request rate grouped by API route.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(dbaas_http_requests_total{job=\"dbaas-svc\",route=~\"$route\"}[5m])) by (route)",
              "legendFormat": "{{route}}"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": ["lastNotNull", "max"]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "decimals": 2,
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 12,
                "showPoints": "never",
                "spanNulls": true
              }
            }
          }
        },

        {
          "id": 2,
          "title": "Latency Percentiles",
          "description": "Overall API latency at p50, p95 and p99.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.50, sum(rate(dbaas_http_request_duration_seconds_bucket{job=\"dbaas-svc\",route=~\"$route\"}[5m])) by (le))",
              "legendFormat": "p50"
            },
            {
              "refId": "B",
              "expr": "histogram_quantile(0.95, sum(rate(dbaas_http_request_duration_seconds_bucket{job=\"dbaas-svc\",route=~\"$route\"}[5m])) by (le))",
              "legendFormat": "p95"
            },
            {
              "refId": "C",
              "expr": "histogram_quantile(0.99, sum(rate(dbaas_http_request_duration_seconds_bucket{job=\"dbaas-svc\",route=~\"$route\"}[5m])) by (le))",
              "legendFormat": "p99"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": ["lastNotNull", "max"]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 3,
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "showPoints": "never",
                "spanNulls": true
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "p50"
                },
                "properties": [
                  {
                    "id": "custom.lineWidth",
                    "value": 1
                  },
                  {
                    "id": "color",
                    "value": {
                      "fixed": "#5794F2"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "p95"
                },
                "properties": [
                  {
                    "id": "custom.lineWidth",
                    "value": 2
                  },
                  {
                    "id": "color",
                    "value": {
                      "fixed": "#FF9830"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "p99"
                },
                "properties": [
                  {
                    "id": "custom.lineWidth",
                    "value": 2
                  },
                  {
                    "id": "color",
                    "value": {
                      "fixed": "#E02F44"
                    }
                  }
                ]
              }
            ]
          }
        },

        {
          "id": 14,
          "title": "HTTP Status Distribution",
          "description": "Request rate grouped into HTTP status classes.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 12
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(dbaas_http_requests_total{job=\"dbaas-svc\",route=~\"$route\"}[5m])) by (status)",
              "legendFormat": "{{status}}"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": ["lastNotNull"]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "decimals": 2,
              "custom": {
                "drawStyle": "bars",
                "lineWidth": 1,
                "fillOpacity": 65,
                "stacking": {
                  "mode": "normal"
                },
                "showPoints": "never"
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": "^2..$"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "fixed": "#73BF69"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": "^3..$"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "fixed": "#FADE2A"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": "^4..$"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "fixed": "#FF9830"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": "^5..$"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "fixed": "#F2495C"
                    }
                  }
                ]
              }
            ]
          }
        },

        {
          "id": 16,
          "title": "Request Volume",
          "description": "Total number of HTTP requests over time.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 12
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(increase(dbaas_http_requests_total{job=\"dbaas-svc\",route=~\"$route\"}[5m]))",
              "legendFormat": "Requests / 5m"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": ["lastNotNull", "max"]
            },
            "tooltip": {
              "mode": "single"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 20,
                "showPoints": "never",
                "spanNulls": true
              }
            }
          }
        },

        {
          "id": 15,
          "title": "CPU Usage",
          "description": "CPU consumption of the DBaaS API process.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 12
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * rate(process_cpu_seconds_total{job=\"dbaas-svc\"}[5m])",
              "legendFormat": "CPU"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": ["lastNotNull", "max"]
            },
            "tooltip": {
              "mode": "single"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 1,
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 15,
                "showPoints": "never",
                "spanNulls": true
              }
            }
          }
        },

        {
          "id": 4,
          "title": "Memory Usage",
          "description": "Resident memory used by the DBaaS API process.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 20
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "process_resident_memory_bytes{job=\"dbaas-svc\"}",
              "legendFormat": "RSS"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": ["lastNotNull", "max"]
            },
            "tooltip": {
              "mode": "single"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "decimals": 1,
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 15,
                "showPoints": "never",
                "spanNulls": true
              }
            }
          }
        },

        {
          "id": 17,
          "title": "5xx Errors Over Time",
          "description": "HTTP 5xx error rate over time.",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 20
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * sum(rate(dbaas_http_requests_total{job=\"dbaas-svc\",route=~\"$route\",status=~\"5..\"}[5m])) / clamp_min(sum(rate(dbaas_http_requests_total{job=\"dbaas-svc\",route=~\"$route\"}[5m])), 0.000001)",
              "legendFormat": "5xx error rate"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": ["lastNotNull", "max"]
            },
            "tooltip": {
              "mode": "single"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 2,
              "min": 0,
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": true
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 5
                  }
                ]
              }
            }
          }
        }
      ],

      "templating": {
        "list": [
          {
            "name": "DS_PROMETHEUS",
            "label": "Prometheus",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 0
          },
          {
            "name": "route",
            "label": "Route",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${DS_PROMETHEUS}"
            },
            "definition": "label_values(dbaas_http_requests_total{job=\"dbaas-svc\"}, route)",
            "query": {
              "query": "label_values(dbaas_http_requests_total{job=\"dbaas-svc\"}, route)",
              "refId": "StandardVariableQuery"
            },
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "refresh": 2,
            "sort": 1,
            "current": {
              "text": "All",
              "value": "$__all"
            }
          }
        ]
      },

      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },

      "links": []
    }
