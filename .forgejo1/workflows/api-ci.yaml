name: DBAAS API CI
on:
  push:
    branches:
      - main
    paths:
      - 'platform/**'
      - '.forgejo/workflows/api-ci.yaml'

permissions:
  contents: write   # needed to push the image-tag bump commit back

jobs:
  build-and-release:
    name: Build, Push, Update APIs
    runs-on: stackit-ubuntu-22
    
    defaults:
      run:
        working-directory: platform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # fetch full history (for rebase) - "fetch-depth: 0"
          # shallow clone - "fetch-depth: 1"
          fetch-depth: 0

      - name: Check architecture
        run: |
          uname -m
          docker version

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'

      # - name: Run tests
      #   run: make test

      - name: Log in to STACKIT Container Registry
        run: |
          echo "${{ secrets.STACKIT_CONTAINER_ROBOT_TOKEN }}" | \
            docker login registry.onstackit.cloud \
            -u "${{ secrets.STACKIT_CONTAINER_ROBOT_USERNAME }}" \
            --password-stdin

      - name: Compute image tag
        id: vars
        run: |
          TAG=$(git rev-parse --short HEAD)
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push api image
        env:
          IMG: registry.onstackit.cloud/dbaas-platform/dbaas-platform-api:${{ steps.vars.outputs.tag }}
          CONTAINER_TOOL: docker
        run: |
          make build
          make push

      - name: Update GitOps image tag
        run: |
          git config user.name "forgejo-actions"
          git config user.email "actions@noreply.local"

          # Get latest main first
          git fetch origin main
          git rebase origin/main

          # Now modify the file
          sed -i "s#newTag: .*#newTag: ${{ steps.vars.outputs.tag }}#" \
            ../gitops/api/overlays/prod/kustomization.yaml

          git add ../gitops/api/overlays/prod/kustomization.yaml

          git commit -m "chore: bump dbaas-platform-api image to ${{ steps.vars.outputs.tag }}" \
            || (echo "No changes to commit" && exit 0)

          git push origin HEAD:main
