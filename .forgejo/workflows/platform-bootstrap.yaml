name: SKE Provisioning and Argo CD Bootstrap

on:
  push:
    branches:
      - main

jobs:
  terraform:
    name: SKE Provisioning
    runs-on: stackit-ubuntu-22

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: terraform init

      - name: Terraform Plan
        working-directory: terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_project_id: ${{ secrets.STACKIT_PROJECT_ID }}
          TF_VAR_service_account_key: ${{ secrets.STACKIT_SERVICE_ACCOUNT_KEY }}
        run: terraform plan

      - name: Terraform Apply
        working-directory: terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_project_id: ${{ secrets.STACKIT_PROJECT_ID }}
          TF_VAR_service_account_key: ${{ secrets.STACKIT_SERVICE_ACCOUNT_KEY }}
        run: terraform apply -auto-approve

      - name: Export kubeconfig
        working-directory: terraform
        run: |
          terraform output -raw kubeconfig > kubeconfig.yaml

      - name: Upload kubeconfig artifact
        uses: actions/upload-artifact@v3
        with:
          name: kubeconfig
          path: terraform/kubeconfig.yaml


  argocd:
    name: Argo CD Bootstrap
    needs: terraform
    runs-on: stackit-ubuntu-22

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download kubeconfig
        uses: actions/download-artifact@v3
        with:
          name: kubeconfig

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          cp kubeconfig.yaml ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Verify Kubernetes connection
        run: |
          kubectl get nodes

      - name: Install Argo CD namespace
        run: |
          kubectl create namespace argocd \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Install Argo CD
        run: |
          kubectl apply \
            -n argocd \
            -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml

      - name: Wait for Argo CD
        run: |
          kubectl wait \
            --for=condition=available \
            deployment/argocd-server \
            -n argocd \
            --timeout=300s