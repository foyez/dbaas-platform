name: SKE Provisioning and Argo CD Bootstrap

on:
  push:
    branches:
      - main
    paths:
      - 'infra/ske-cluster/**'
      - '.forgejo/workflows/k8s-bootstrap.yaml'

jobs:
  ske-provision:
    name: Provision SKE Cluster
    runs-on: stackit-ubuntu-22

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: infra/terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: infra/terraform
        env:
          TF_VAR_project_id: ${{ secrets.STACKIT_PROJECT_ID }}
          TF_VAR_service_account_key: ${{ secrets.STACKIT_SERVICE_ACCOUNT_KEY }}
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: infra/terraform
        env:
          TF_VAR_project_id: ${{ secrets.STACKIT_PROJECT_ID }}
          TF_VAR_service_account_key: ${{ secrets.STACKIT_SERVICE_ACCOUNT_KEY }}
        run: terraform apply -auto-approve tfplan

      # - name: Export kubeconfig
      #   working-directory: infra/terraform
      #   run: terraform output -raw kubeconfig > kubeconfig.yaml

      # # GHES compatibility: upload-artifact@v4 is not supported.
      # # Keep v3 until the STACKIT GitHub Enterprise instance is upgraded.
      # - name: Upload kubeconfig artifact
      #   uses: actions/upload-artifact@v3
      #   with:
      #     name: kubeconfig
      #     path: terraform/kubeconfig.yaml
      #     retention-days: 1

  argocd:
    name: Bootstrap Argo CD
    runs-on: stackit-ubuntu-22
    needs: ske-provision

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: infra/terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: terraform init

      - name: Export kubeconfig
        working-directory: infra/terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: terraform output -raw kubeconfig > kubeconfig.yaml

      # install creates the file with the correct permissions 
      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          install -m 600 infra/terraform/kubeconfig.yaml "$HOME/.kube/config"

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.32.0

      - name: Verify cluster connection
        run: |
          kubectl config current-context
          kubectl get nodes

      - name: Create Argo CD namespace
        run: |
          kubectl create namespace argocd \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      # --server-side avoids client-side apply annotation size limits of approximately 256KB
      # when applying Kubernetes resources with large manifests.
      - name: Install Argo CD
        run: |
          kubectl apply \
            --server-side \
            -n argocd \
            -f https://raw.githubusercontent.com/argoproj/argo-cd/v3.1.0/manifests/install.yaml

      - name: Wait for Argo CD
        run: |
          kubectl wait \
            --for=condition=available \
            deployment/argocd-server \
            -n argocd \
            --timeout=300s

      - name: Verify Argo CD installation
        run: |
          kubectl get pods -n argocd

      - name: Configure Argo CD repository credentials
        run: |
          kubectl create secret generic postgres-platform-repo \
            -n argocd \
            --from-literal=type=git \
            --from-literal=url=https://level3.git.onstackit.cloud/LEVEL3/foyez-inra.git \
            --from-literal=username=${{ secrets.STACKIT_GIT_USERNAME }} \
            --from-literal=password=${{ secrets.STACKIT_DBAAS_REPO_TOKEN }} \
            --dry-run=client \
            -o yaml | kubectl apply -f -

          kubectl label secret postgres-platform-repo \
            -n argocd \
            argocd.argoproj.io/secret-type=repository \
            --overwrite

      - name: Bootstrap Argo CD Applications
        run: |
          kubectl apply -f gitops/argocd/root-app.yaml