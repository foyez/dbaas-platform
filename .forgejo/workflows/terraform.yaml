name: Terraform

on:
  push:
    branches:
      - main

jobs:
  terraform:
    runs-on: stackit-ubuntu-22

    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      - name: Terraform Init
        working-directory: terraform
        run: terraform init


      - name: Terraform Plan
        working-directory: terraform
        env:
          TF_VAR_project_id: ${{ secrets.STACKIT_PROJECT_ID }}
          TF_VAR_service_account_key: ${{ secrets.STACKIT_SERVICE_ACCOUNT_KEY }}
        run: terraform plan


      - name: Terraform Apply
        working-directory: terraform
        env:
          TF_VAR_project_id: ${{ secrets.STACKIT_PROJECT_ID }}
          TF_VAR_service_account_key: ${{ secrets.STACKIT_SERVICE_ACCOUNT_KEY }}
        run: terraform apply -auto-approve
