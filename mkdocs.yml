site_name: DBaaS Platform
site_description: A self-service PostgreSQL Database-as-a-Service, built from raw IaaS up to a product on Kubernetes.
site_url: https://foyez.github.io/dbaas-platform/
repo_url: https://github.com/foyez/dbaas-platform
repo_name: foyez/dbaas-platform
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      # GitHub-style anchors, so in-page links written on GitHub keep working.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Architecture: architecture/index.md
  - Design decisions:
      - design-decisions/index.md
      - design-decisions/kubernetes-as-state-store.md
      - design-decisions/own-crd-over-cnpg.md
      - design-decisions/shared-loadbalancer.md
      - design-decisions/idempotent-creation.md
      - design-decisions/sql-console-through-api.md
      - design-decisions/auth-with-zitadel.md
      - design-decisions/audit-in-loki.md
      - design-decisions/gitops-delivery.md
  - API reference: api-reference.md
  - Components:
      - components/index.md
      - components/operator.md
      - components/api.md
      - components/frontend.md
      - components/auth.md
      - components/sdk.md
      - components/delivery.md
      - components/observability.md
      - components/infrastructure.md
  - Learning notes:
      - notes/index.md
      - Infrastructure:
          - notes/openstack.md
          - notes/terraform.md
          - notes/kubernetes-on-vms.md
      - Kubernetes:
          - notes/kubernetes-concepts.md
          - notes/operators.md
      - API:
          - notes/api-design.md
          - notes/connection-pooling.md
          - notes/health-and-scaling.md
          - notes/go-sdk.md
      - Networking:
          - notes/networking.md
          - notes/exposing-services.md
      - Security:
          - notes/kubernetes-security.md
          - notes/authentication.md
      - Frontend:
          - notes/frontend.md
      - Operations:
          - notes/gitops.md
          - notes/observability.md
