name: Docs

# Builds the MkDocs site and checks its Mermaid diagrams on every docs change,
# and publishes it to GitHub Pages from main. Uses the same pinned images as
# `make docs-build` and `make docs-check`.
on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "Makefile"
      - "hack/docs/**"
      - "platform/docs/openapi.yaml"
      - "platform/docs/redocly.yaml"
      - "platform/docs/.redocly.lint-ignore.yaml"
      - ".github/workflows/docs.yaml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "Makefile"
      - "hack/docs/**"
      - "platform/docs/openapi.yaml"
      - "platform/docs/redocly.yaml"
      - "platform/docs/.redocly.lint-ignore.yaml"
      - ".github/workflows/docs.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build site (strict)
        run: make docs-build

      # mkdocs can't see Mermaid errors: diagrams render in the browser.
      - name: Check Mermaid diagrams
        run: make docs-check

      # The API reference page renders platform/docs/openapi.yaml.
      - name: Lint OpenAPI spec
        run: make api-lint

      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
