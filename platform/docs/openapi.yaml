openapi: 3.0.3

info:
  title: PostgreSQL Platform API
  version: 0.1.0
  description: API for managing PostgreSQL instances.

servers:
  - url: http://localhost:8080
    description: Local
  - url: http://foyez.runs.onstackit.cloud
    description: Server

tags:
  - name: instances
    description: Operations on PaaS product instances
 
security:
  - bearerAuth: []

paths:
  /api/v1/instances:
    post:
      tags: [instances]
      operationId: createInstance
      summary: Create a new product instance
      description: >
        Accepts a request to provision a new product instance. The instance
        is created asynchronously; this endpoint returns as soon as the
        underlying resource has been accepted, not once provisioning has
        completed. Clients should poll `GET /instances/{id}` and inspect
        `status` until it reaches `Running`.


        This operation is idempotent when the `Idempotency-Key` header is
        supplied: repeating the same request with the same key returns the
        original instance instead of creating a duplicate.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInstanceRequest'
            examples:
              basic:
                value:
                  name: my-postgres-db
                  version: 16
                  storage: 10Gi
      responses:
        '202':
          description: >
            Request accepted. The instance has been registered and
            provisioning has started asynchronously.
          headers:
            Location:
              description: URL of the created instance resource
              schema:
                type: string
                example: /v1/instances/inst-7f3a2b
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instance'
              examples:
                accepted:
                  value:
                    id: inst-7f3a2b
                    name: my-postgres-db
                    version: 16
                    storage: 10Gi
                    status: Pending
                    createdAt: "2026-08-04T09:12:00Z"
        '200':
          description: >
            Idempotent replay: a request with this `Idempotency-Key` was
            already processed. Returns the current state of the existing
            instance rather than creating a new one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instance'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: An instance with this name already exists and does not match the idempotency key provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

    get:
      tags: [instances]
      operationId: listInstances
      summary: List PostgreSQL instances
      description: Returns all instances visible to the caller.
      responses:
        '200':
          description: List of instances.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListInstancesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/instances/{id}:
    get:
      tags: [instances]
      operationId: getInstance
      summary: Get a PostgreSQL instance
      description: >
        Returns the current state of a single instance, including its
        `status`. Use this to poll an instance created via
        `POST /instances` until it reaches `Running`.
      parameters:
        - $ref: '#/components/parameters/InstanceId'
      responses:
        '200':
          description: The instance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instance'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    patch:
      tags: [instances]
      operationId: updateInstance
      summary: Update a PostgreSQL instance
      description: >
        Applies a partial update to an instance, such as a storage resize
        or a PostgreSQL version upgrade. The update is applied
        asynchronously; this endpoint returns as soon as the change has
        been accepted, not once it has completed. At least one field
        must be provided.
      parameters:
        - $ref: '#/components/parameters/InstanceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInstanceRequest'
            examples:
              resize:
                value:
                  storage: 20Gi
      responses:
        '202':
          description: Update accepted and applied asynchronously.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instance'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [instances]
      operationId: deleteInstance
      summary: Delete a PostgreSQL instance
      description: >
        Deletes a PostgreSQL instance asynchronously. The request returns
        immediately with `202 Accepted`; actual deletion is performed
        later by the Kubernetes operator.
      parameters:
        - $ref: '#/components/parameters/InstanceId'
      responses:
        '202':
          description: Deletion accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteAcceptedResponse'
              example:
                message: Deletion initiated
                status: Deleting
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    InstanceId:
      name: id
      in: path
      required: true
      description: Unique identifier of the product instance
      schema:
        type: string
        example: inst-7f3a2b
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >
        Client-generated unique key (UUID recommended) identifying a
        logical create operation. Replaying the same key returns the
        original result instead of creating a duplicate instance.
      schema:
        type: string
        format: uuid
        example: 5b1e3c2a-4f3a-4e9a-9d0a-2f6b7a8c9d10

  schemas:
    CreateInstanceRequest:
      type: object
      required: [name, storage, version]
      properties:
        name:
          type: string
          description: >
            Unique instance name, 3-63 characters.
          minLength: 3
          maxLength: 63
          example: my-app-db
        version:
          type: integer
          description: Major CNPG/PostgreSQL version.
          enum: [14, 15, 16]
          example: 16
        storage:
          type: string
          description: Kubernetes resource quantity for storage.
          pattern: '^[0-9]+(Gi|Mi)$'
          example: 10Gi
        instances:
          type: integer
          description: >
            Accepted by the API but not yet wired to provisioning;
            every instance is currently created as a single replica
            regardless of this value.
          minimum: 1
          maximum: 5
          default: 1
          example: 1
        username:
          type: string
          description: Team or user identifier, used for filtering and RBAC.
          maxLength: 128
          example: team-checkout
      example:
        name: my-app-db
        version: 16
        storage: 10Gi
        username: team-checkout

    UpdateInstanceRequest:
      type: object
      description: >
        Partial update payload. At least one property must be provided.
      minProperties: 1
      properties:
        version:
          type: integer
          description: Major CNPG/PostgreSQL version to upgrade to.
          enum: [14, 15, 16]
          example: 16
        storage:
          type: string
          description: New Kubernetes resource quantity for storage. Must not shrink.
          pattern: '^[0-9]+(Gi|Mi)$'
          example: 20Gi
      example:
        storage: 20Gi

    Instance:
      type: object
      properties:
        id:
          type: string
          example: inst-7f3a2b
        name:
          type: string
          example: my-postgres-db
        version:
          type: integer
          example: 16
        storage:
          type: string
          example: 10Gi
        status:
          type: string
          description: >
            `Pending` while the operator is provisioning/reconciling the
            underlying resource, `Running` once ready, `Failed` if
            reconciliation failed, `Deleted` once removed.
          enum: [Pending, Running, Failed, Deleted]
          example: Pending
        createdAt:
          type: string
          format: date-time
          example: "2026-08-04T09:12:00Z"

    ListInstancesResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Instance'

    DeleteAcceptedResponse:
      type: object
      properties:
        message:
          type: string
          example: Deletion initiated
        status:
          type: string
          example: Deleting

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: INSTANCE_NOT_FOUND
            message:
              type: string
              example: Product instance does not exist.

  responses:
    BadRequest:
      description: Malformed request body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid authentication credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated but not permitted to access this instance
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Instance does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Request was well-formed but semantically invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'