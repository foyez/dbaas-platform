- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600


- name: Disable swap
  shell: |
    swapoff -a
    sed -i '/ swap / s/^/#/' /etc/fstab


- name: Load Kubernetes kernel modules
  copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter


- name: Load kernel modules immediately
  shell: |
    modprobe overlay
    modprobe br_netfilter


- name: Configure Kubernetes networking sysctl
  copy:
    dest: /etc/sysctl.d/k8s.conf
    content: |
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward = 1


- name: Apply sysctl settings
  command: sysctl --system


- name: Install containerd
  apt:
    name: containerd
    state: present
    update_cache: yes


- name: Ensure containerd configuration directory exists
  file:
    path: /etc/containerd
    state: directory


- name: Generate containerd default configuration
  shell: |
    containerd config default > /etc/containerd/config.toml
  args:
    creates: /etc/containerd/config.toml


- name: Enable SystemdCgroup
  replace:
    path: /etc/containerd/config.toml
    regexp: 'SystemdCgroup = false'
    replace: 'SystemdCgroup = true'


- name: Enable and restart containerd
  systemd:
    name: containerd
    enabled: yes
    state: restarted
