- name: Ensure hostname resolves locally
  lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1'
    line: "127.0.1.1 {{ ansible_facts.hostname }}"

- name: Add all cluster nodes to /etc/hosts
  lineinfile:
    path: /etc/hosts
    regexp: '.*\s{{ item }}$'
    line: "{{ hostvars[item].private_ip) }} {{ item }}"
    state: present
  loop: "{{ groups['kubernetes'] }}"
