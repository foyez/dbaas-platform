# ZITADEL's own database, run by the CNPG operator the platform already uses.
# CNPG writes the connection string to the zitadel-db-app secret (key: uri).
apiVersion: v1
kind: Namespace
metadata:
  name: zitadel
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: zitadel-db
  namespace: zitadel
spec:
  instances: 1
  storage:
    size: 1Gi
  bootstrap:
    initdb:
      database: zitadel
      owner: zitadel
