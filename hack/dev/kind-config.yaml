# Local cluster for `make dev`. Port 80 on the host goes to ingress-nginx,
# which routes *.dbaas.localhost to the frontend, API and ZITADEL.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: dbaas-dev
nodes:
  - role: control-plane
    # ingress-nginx's last release (v1.15) supports Kubernetes <= 1.35.
    image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
    labels:
      ingress-ready: "true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        listenAddress: 127.0.0.1
        protocol: TCP
